name: ai-ticketing-mcp
x-runtime: &runtime
  build: .
  image: ai-ticketing-mcp:local
  init: true
  restart: unless-stopped
  environment: &environment
    STORAGE_ADAPTER: ${STORAGE_ADAPTER:-postgres}
    SQLITE_PATH: ${SQLITE_PATH:-}
    DATABASE_URL: postgresql://ticketing_app:${APP_DB_PASSWORD:?Run node scripts/setup.mjs}@db:5432/ticketing
    EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-ollama}
    EMBEDDING_URL: ${EMBEDDING_URL:-http://ollama:11434}
    EMBEDDING_MODEL: ${EMBEDDING_MODEL:-nomic-embed-text}
    EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-768}
    EMBEDDING_REVISION: ${EMBEDDING_REVISION:-1}
    REFERENCE_TOKEN_METRICS: ${REFERENCE_TOKEN_METRICS:-false}
    MCP_PROFILE_CAPTURE: ${MCP_PROFILE_CAPTURE:-true}
    MCP_PROFILE_DIRECTORY: /app/.local/token-profiles
    MCP_PROFILE_MAX_FILE_BYTES: ${MCP_PROFILE_MAX_FILE_BYTES:-8388608}
    MCP_PROFILE_MAX_FILES: ${MCP_PROFILE_MAX_FILES:-8}
    MCP_PROFILE_MAX_QUEUE_BYTES: ${MCP_PROFILE_MAX_QUEUE_BYTES:-16777216}
    TICKETING_GITHUB_REPOSITORY: ${TICKETING_GITHUB_REPOSITORY:-}
    TICKETING_GITHUB_REQUIRED_CHECKS: ${TICKETING_GITHUB_REQUIRED_CHECKS:-}
    TICKETING_GITHUB_CHECK_APP_ID: ${TICKETING_GITHUB_CHECK_APP_ID:-}
    GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    TICKETING_WEBHOOK_URL: ${TICKETING_WEBHOOK_URL:-}
    TICKETING_WEBHOOK_SECRET: ${TICKETING_WEBHOOK_SECRET:-}
    EMBEDDING_SPACE_ID: ${EMBEDDING_SPACE_ID:-}
    EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
  depends_on:
    migrate:
      condition: service_completed_successfully
services:
  db:
    image: pgvector/pgvector:pg17
    shm_size: 512mb
    restart: unless-stopped
    environment:
      POSTGRES_USER: ticketing_owner
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Run node scripts/setup.mjs}
      POSTGRES_DB: ticketing
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Run node scripts/setup.mjs}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Run node scripts/setup.mjs}
    ports: ['127.0.0.1:${DB_PORT:-5432}:5432']
    volumes:
      - database:/var/lib/postgresql/data
      - ./deploy/init-db.sh:/docker-entrypoint-initdb.d/10-roles.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ticketing_owner -d ticketing']
      interval: 3s
      timeout: 3s
      retries: 20
  migrate:
    <<: *runtime
    restart: 'no'
    command: ['migrate']
    environment:
      <<: *environment
      DATABASE_URL: postgresql://ticketing_owner:${DB_PASSWORD}@db:5432/ticketing
    depends_on:
      db:
        condition: service_healthy
  app:
    <<: *runtime
    volumes: ['token_profiles:/app/.local/token-profiles']
    environment:
      <<: *environment
      HOST: 0.0.0.0
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3000}
      OAUTH_ISSUER: ${OAUTH_ISSUER:-http://localhost:8080/realms/ticketing}
      OAUTH_AUDIENCE: ${OAUTH_AUDIENCE:-http://localhost:3000/mcp}
      OAUTH_JWKS_URL: ${OAUTH_JWKS_URL:-http://keycloak:8080/realms/ticketing/protocol/openid-connect/certs}
      ALLOWED_ORIGIN_HOSTS: ${ALLOWED_ORIGIN_HOSTS:-localhost}
    ports: ['127.0.0.1:${PORT:-3000}:3000']
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
  worker:
    <<: *runtime
    command: ['worker']
  keycloak:
    image: quay.io/keycloak/keycloak:26.4.7
    profiles: ['auth']
    command: ['start-dev', '--import-realm']
    restart: unless-stopped
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Run node scripts/setup.mjs}
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8080}
      KC_HEALTH_ENABLED: 'true'
    ports: ['127.0.0.1:8080:8080']
    volumes: ['./deploy/keycloak-realm.json:/opt/keycloak/data/import/ticketing.json:ro']
    depends_on:
      db:
        condition: service_healthy
  ollama:
    image: ollama/ollama:0.13.0
    profiles: ['local-ai']
    restart: unless-stopped
    volumes: ['models:/root/.ollama']
    ports: ['127.0.0.1:11434:11434']
  model-pull:
    image: ollama/ollama:0.13.0
    profiles: ['local-ai']
    restart: on-failure
    environment:
      OLLAMA_HOST: http://ollama:11434
    command: ['pull', 'nomic-embed-text']
    depends_on: [ollama]
volumes:
  database:
  models:
  token_profiles:
