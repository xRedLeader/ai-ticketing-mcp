services:
  app:
    environment:
      PUBLIC_URL: ${PUBLIC_URL:?Set the public HTTPS origin}
      OAUTH_ISSUER: ${OAUTH_ISSUER:?Set the exact public realm issuer}
      OAUTH_AUDIENCE: ${OAUTH_AUDIENCE:?Set the exact public MCP resource URL}
      ALLOWED_ORIGIN_HOSTS: ${ALLOWED_ORIGIN_HOSTS:?Set trusted browser hostnames}
      OAUTH_JWKS_URL: ${OAUTH_JWKS_URL:?Set the public HTTPS Keycloak signing key URL}
      OAUTH_ALLOW_LOCAL_KEYCLOAK_JWKS: 'false'
    ports: !reset []
  db:
    ports: !reset []
  ollama:
    ports: !reset []
  keycloak:
    entrypoint:
      - /bin/bash
      - -ec
      - |
        if [ "$${#KC_BOOTSTRAP_ADMIN_PASSWORD}" -lt 32 ]; then
          echo 'KEYCLOAK_ADMIN_PASSWORD: set a private generated password before startup.' >&2
          exit 1
        fi
        exec /opt/keycloak/bin/kc.sh "$$@"
      - --
    command: ['start', '--import-realm', '--http-enabled=true', '--proxy-headers=xforwarded']
    environment:
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_URL:?Set the public HTTPS login origin}
    ports: !reset []
    volumes: !override
      - ./.local/keycloak-realm.production.json:/opt/keycloak/data/import/ticketing.json:ro
  proxy:
    image: caddy:2
    restart: unless-stopped
    environment:
      TICKETING_DOMAIN: ${TICKETING_DOMAIN:?Set TICKETING_DOMAIN}
      LOGIN_DOMAIN: ${LOGIN_DOMAIN:?Set LOGIN_DOMAIN}
    ports: ['80:80', '443:443']
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - certificates:/data
      - proxy_config:/config
    depends_on: [app, keycloak]
    networks:
      default:
        aliases: ['${LOGIN_DOMAIN:?Set LOGIN_DOMAIN}']
volumes:
  certificates:
  proxy_config:
