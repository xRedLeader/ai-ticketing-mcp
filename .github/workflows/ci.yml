name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: integration-test-only
          POSTGRES_DB: ticketing_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://postgres:integration-test-only@localhost:5432/ticketing_test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run secrets:check
      - run: npm run format:check
      - run: npm test
      - run: npm run test:integration
      - run: npm run benchmark:protocol
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
      - name: Validate pull request commits and title
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: node scripts/check-commits.mjs "$BASE_SHA..$HEAD_SHA"
      - name: Validate main commit
        if: github.event_name == 'push'
        env:
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            node scripts/check-commits.mjs "$HEAD_SHA"
          else
            node scripts/check-commits.mjs "$BASE_SHA..$HEAD_SHA"
          fi
      - name: Build runtime image
        run: docker build -t ai-ticketing-mcp:ci .
